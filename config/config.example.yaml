# Copy to config/config.yaml (gitignored) or run `audio-to-note init`.
# Supports ${ENV_VAR} and ${ENV_VAR:-default} expansion.

pipeline:
  outputs_dir: outputs
  hotwords_file: "" # Auto-detects config/hotwords.local.txt -> hotwords.example.txt
  default_prompt: meeting_minutes # meeting_minutes | research_discussion | lecture_notes
  polish_enabled: false
  summarize_enabled: true
  output_language: auto # auto | Chinese | English | ...
  sample_rate: 24000
  long_audio:
    single_pass_max_seconds: 3300
    chunk_seconds: 3000
    overlap_seconds: 45

asr:
  provider: crispasr # crispasr | audio_cpp | vibeasr_cpp | openai_compat | faster_whisper | command
  language: auto # auto | en | zh | ja | ...
  providers:
    crispasr:
      runtime_bin: vendor/CrispASR/build-cuda129/bin/crispasr
      model: models/vibevoice-asr-q4_k.gguf
      backend: vibevoice
      gpu_backend: cuda
      threads: 4
      sample_rate: 24000
    audio_cpp:
      runtime_bin: vendor/audio.cpp/build/bin/audiocpp_cli
      model: models/vibevoice-asr-q8_0.gguf
      backend: cuda
      family: vibevoice_asr
      sample_rate: 24000
    vibeasr_cpp:
      runtime_bin: vendor/VibeASR.cpp/build/bin/asr_infer
      vae_model: models/vibevoice-bitnet/vibeasr-vae-encoder-i8_s.gguf
      lm_model: models/vibevoice-bitnet/vibeasr-lm-i2_s-embed-q6_k.gguf
      backend: cpu
      threads: 16
      sample_rate: 24000
      long_audio:
        single_pass_max_seconds: 120
        chunk_seconds: 120
        overlap_seconds: 15
    openai_compat:
      base_url: ${A2N_ASR_BASE_URL:-https://api.openai.com/v1}
      api_key: ${A2N_ASR_API_KEY:-${OPENAI_API_KEY:-}}
      model: ${A2N_ASR_MODEL:-whisper-1}
      sample_rate: 16000
    faster_whisper:
      model: large-v3-turbo
      device: auto
      compute_type: auto
      beam_size: 5
      vad_filter: true
      sample_rate: 16000
    command:
      command: ""
      sample_rate: 16000

diarization:
  provider: none # none | sherpa_onnx | pyannote | command
  num_speakers: null
  min_speakers: null
  max_speakers: null
  providers:
    sherpa_onnx:
      segmentation_model: models/diarization/pyannote-segmentation-3-0/model.onnx
      embedding_model: models/diarization/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
      threshold: 0.5
      num_threads: 4
    pyannote:
      model: pyannote/speaker-diarization-3.1
      hf_token: ${HF_TOKEN:-}
      device: auto
    command:
      command: ""

llm:
  provider: openai_compat # openai_compat | llama_cli
  preset: ollama
  model: ${A2N_LLM_MODEL:-qwen2.5:7b}
  temperature: 0.2
  max_tokens: 4096
  max_context_tokens: 12000 # Automatically switches to map-reduce above this budget
  providers:
    openai_compat:
      base_url: ${A2N_LLM_BASE_URL:-http://127.0.0.1:11434/v1}
      api_key: ${A2N_LLM_API_KEY:-${OPENAI_API_KEY:-ollama}}
      timeout_seconds: 300
    llama_cli:
      runtime_bin: llama-cli
      model: ""
      n_gpu_layers: -1
      ctx_size: 16384
      threads: 8
